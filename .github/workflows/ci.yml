name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: build + typecheck + test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: node --test test/*.test.js

      - name: Assert dist matches src
        run: |
          npm run build
          git diff --exit-code dist/ || { echo "dist/ is out of date — run 'npm run build' and commit the changes"; exit 1; }

  desktop-patch-syntax:
    name: Desktop RTL patch — syntax + engine checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check shell patch scripts (Linux + macOS)
        run: |
          bash -n patch/linux/desktop-rtl.sh
          bash -n patch/macos/desktop-rtl.sh

      - name: Syntax check the shared Node engine
        run: node --check patch/lib/patch-asar.mjs

      - name: Run the desktop-patch engine tests
        run: node --test test/patch-engine.test.js
